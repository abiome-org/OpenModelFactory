apiVersion: omf.dev/v1alpha1
kind: Project
metadata:
  name: open-model-factory
  namespace: local/open-model-factory
spec:
  owners:
    - local-user
  extensions:
    defaultBinding: bindings/local.yaml
    localStore: .omf/store
    policyDirectory: policies
    moduleDirectories:
      - modules
    telemetry:
      exporter: local
      callHome: false
