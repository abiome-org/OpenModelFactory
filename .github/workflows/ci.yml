name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: "python -m pip install --only-binary=:all: --require-hashes -r requirements.lock"
      - run: "python -m pip install --only-binary=:all: --require-hashes -r requirements.build.lock"
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m ruff check factory tests modules/examples
      - run: python -m ruff format --check factory tests modules/examples
      - run: python -m mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: "python -m pip install --only-binary=:all: --require-hashes -r requirements.lock"
      - run: "python -m pip install --only-binary=:all: --require-hashes -r requirements.build.lock"
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pytest --cov=omf --cov-report=term

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: "python -m pip install --only-binary=:all: --require-hashes -r requirements.lock"
      - run: "python -m pip install --only-binary=:all: --require-hashes -r requirements.build.lock"
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: make release-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
