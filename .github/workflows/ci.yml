name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: make setup
      - name: Allow unprivileged user namespaces for module network isolation
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --net true
      - run: make test-all
      - name: Train, compare, recover, reproduce, and export a real model
        if: matrix.python == '3.12'
        run: make example
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: model-experiment
          path: |
            .venv/text-classification/results.json
            .venv/text-classification/review.html
          include-hidden-files: true
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: make setup
      - run: make release-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
