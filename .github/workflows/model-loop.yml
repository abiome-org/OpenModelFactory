name: model-loop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "modules/**"
      - "data/**"
      - "workloads/**"
      - "model-packages/**"
      - "evaluations/**"
      - "mixes/**"
      - "factory/**"
      - "tests/test_manual.py"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "data/**"
      - "workloads/**"
      - "model-packages/**"
      - "evaluations/**"
      - "mixes/**"
      - "factory/**"
      - "tests/test_manual.py"

permissions:
  contents: read

jobs:
  baseline-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: "python -m pip install --only-binary=:all: --require-hashes -r requirements.lock"
      - run: "python -m pip install --only-binary=:all: --require-hashes -r requirements.build.lock"
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pytest tests/test_manual.py::test_greenfield_model_card_to_compared_candidate
