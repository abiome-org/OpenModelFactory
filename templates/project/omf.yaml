apiVersion: omf.dev/v1alpha1
kind: Project
metadata:
  name: __OMF_PROJECT_NAME__
  namespace: __OMF_PROJECT_NAMESPACE__
spec:
  owners:
    - local-user
  extensions:
    defaultBinding: bindings/local.yaml
    localStore: .omf/store
    policyDirectory: policies
    moduleDirectories:
      - modules
    telemetry:
      exporter: local
      callHome: false
