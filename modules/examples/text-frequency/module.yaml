kind: model
code_root: .
argv:
  - python3
  - main.py
schemas:
  input: omf.example.text/v1
  output: omf.example.frequency-model/v1
capabilities:
  - cpu
platforms:
  - linux
  - darwin
resources:
  cpu_seconds: 30
  address_space: 536870912
  timeout_seconds: 30
determinism: bitwise
checkpoint: false
side_effects: []
concurrency: 1
secrets: []
network: []
fixtures:
  - request:
      operation: validate
    result:
      status: ok
