apiVersion: omf.dev/v1alpha1
kind: Module
metadata:
  name: affine-serving
spec:
  entryPoint:
    command: [python3, main.py]
  environment:
    dependencyLock: requirements.lock
    dependencyDigest: sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
  contracts:
    input:
      type: object
      required: [input]
      properties: {input: {type: number}}
      additionalProperties: false
    output:
      type: object
      required: [prediction]
      properties: {prediction: {type: number}}
      additionalProperties: false
    config:
      type: object
      additionalProperties: false
    state:
      type: object
      required: [slope, intercept, format]
      properties:
        slope: {type: number}
        intercept: {type: number}
        format: {const: json-affine/v1}
      additionalProperties: false
  fixtures:
    - request:
        operation: run
        inputs: {input: 3.0}
        state: {slope: 2.0, intercept: 1.0, format: json-affine/v1}
        config: {}
      result:
        status: ok
        outputs: {prediction: 7.0}
